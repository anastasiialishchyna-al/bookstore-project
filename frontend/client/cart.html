<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Cart</title>
  <link rel="stylesheet" href="../assets/css/client.css" />
  <script src="../assets/js/client.js" defer></script>
</head>

<body>

  <header class="topbar">
  <div class="topbar-left">
    <div class="logo">BookStore</div>

    <div class="search-wrapper">
      <input id="searchInput" type="text" placeholder="Search by title, author, or keyword..." />
    </div>

    <select id="genreFilter" class="genre-select">
      <option value="all">All genres</option>
      <option value="detective">Detective</option>
      <option value="classic">Classic</option>
      <option value="fantasy">Fantasy</option>
      <option value="sci-fi">Science fiction</option>
    </select>
  </div>

  <div class="topbar-right">
    <button class="btn ghost" id="basketBtn">
      Basket(<span class="basket-count">0</span>)
    </button>
    <button class="btn primary" id="loginBtn">Login / Register</button>
  </div>
</header>

<!-- Toast Notification -->
<div id="toast" class="toast">Book added to cart</div>



  <main class="cart-layout">
    <section class="cart-items">
      <h1>Your Cart</h1>
      <div id="cartList"></div>

      <p class="create-account-hint">
        Want to create an account?
        <a href="./auth.html">Click here</a>
      </p>
    </section>

    <aside class="cart-summary">
      <h2>Order Summary</h2>

      <div class="summary-row">
        <span>Quantity:</span>
        <span id="summaryQty">0</span>
      </div>

      <div class="summary-row">
        <span>Delivery:</span>
        <span>Free</span>
      </div>

      <div class="summary-row total">
        <span>Total:</span>
        <span id="summaryTotal">$0.00</span>
      </div>

      <button class="btn primary" id="checkoutBtn">Checkout</button>
    </aside>
  </main>


  <footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 BookStore</span>
    <span>Contact: support@bookstore.com</span>
    <span>Kyiv, UA</span>
  </div>
</footer>

</body>
</html>
