<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <link rel="stylesheet" href="../assets/css/client.css" />
  <script src="../assets/js/client.js" defer></script>
</head>

<body>

  <header class="topbar">
  <div class="topbar-left">
    <div class="logo">BookStore</div>

    <div class="search-wrapper">
      <input id="searchInput" type="text" placeholder="Search by title, author, or keyword..." />
    </div>

    <select id="genreFilter" class="genre-select">
      <option value="all">All genres</option>
      <option value="detective">Detective</option>
      <option value="classic">Classic</option>
      <option value="fantasy">Fantasy</option>
      <option value="sci-fi">Science fiction</option>
    </select>
  </div>

  <div class="topbar-right">
    <button class="btn ghost" id="basketBtn">
      Basket(<span class="basket-count">0</span>)
    </button>
    <button class="btn primary" id="loginBtn">Login / Register</button>
  </div>
</header>

<!-- Toast Notification -->
<div id="toast" class="toast">Book added to cart</div>


  <main class="profile-layout">

    <aside class="profile-menu">
      <h2>My Account</h2>
      <ul>
        <li class="active" data-section="details">Personal Details</li>
        <li data-section="orders">Orders</li>
      </ul>
    </aside>

    <section class="profile-content">

      <div id="section-details" class="profile-section active">
        <h1>Personal Details</h1>

        <label>Name</label>
        <input type="text" id="profName" />

        <label>Phone number</label>
        <input type="text" id="profPhone" />

        <label>Email</label>
        <input type="email" id="profEmail" />

        <label>Delivery Address</label>
        <input type="text" id="profAddress" />

        <button class="btn primary" id="saveProfileBtn">Save Changes</button>
      </div>

      <div id="section-orders" class="profile-section">
        <h1>My Orders</h1>
        <div id="ordersList"></div>
      </div>

    </section>

  </main>


  <footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 BookStore</span>
    <span>Contact: support@bookstore.com</span>
    <span>Kyiv, UA</span>
  </div>
</footer>

</body>
</html>
